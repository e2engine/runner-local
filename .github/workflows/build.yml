name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Go version
        run: go version

      - name: Verify
        run: make verify
