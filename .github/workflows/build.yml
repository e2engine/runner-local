name: build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Verify dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=10m

  vulncheck:
    name: Check vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Check vulnerabilities
        run: make vulncheck

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Test
        run: go test ./... -count=1 -timeout=600s

  race:
    name: Race detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Race tests
        run: go test -race ./... -count=1 -timeout=600s
